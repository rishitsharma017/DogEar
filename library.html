<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Chat Bookmarks – Library</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><svg class="brand-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg> AI Chat Bookmarks</div>
    <nav id="projects"></nav>
    <div id="backup" class="backup"></div>
    <input id="restore-file" type="file" accept=".json,application/json" hidden>
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false">
      <span>Dark mode</span><span class="switch" aria-hidden="true"></span>
    </button>
  </aside>

  <main>
    <header class="head">
      <div class="title-row">
        <h1 id="title"></h1>
        <span id="count" class="count"></span>
      </div>
      <div id="project-actions" class="actions" hidden>
        <button id="rename">Rename</button>
        <button id="export">Export .md</button>
        <button id="delete" class="danger">Delete</button>
      </div>
      <div id="trash-actions" class="actions" hidden>
        <button id="empty-trash" class="danger">Delete all forever</button>
      </div>
    </header>

    <p id="trash-note" class="note" hidden>Deleted projects and answers are kept here for 30 days.</p>

    <div id="toolbar" class="toolbar">
      <input id="search" type="search" placeholder="Search saved answers…" autocomplete="off">
      <span id="ai-filter"></span>
      <span id="sort"></span>
      <button id="select-mode" title="Tick several answers to move or delete them together">Select</button>
    </div>

    <div id="selection-bar" class="selection-bar" hidden>
      <label><input id="select-all" type="checkbox"> <span id="selected-count"></span></label>
      <span class="spacer"></span>
      <span id="bulk-move"></span>
      <button id="bulk-delete" class="danger">Delete</button>
      <button id="bulk-done">Done</button>
    </div>

    <div id="list"></div>
  </main>

  <nav id="index" class="index" aria-label="Jump to a section" hidden></nav>

  <div id="undo" class="undo" hidden>
    <span id="undo-text"></span>
    <button id="undo-btn">Undo</button>
  </div>

  <script src="common.js"></script>
  <script src="library.js"></script>
</body>
</html>
